<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ADMIN Live DLs</title>
<style>
body{background:#0a0a0a;color:#fff;font-family:Arial;padding:15px}
h1{color:#00ff88}
.card{background:#1e1e1e;padding:15px;border-radius:12px;margin:12px 0}
table{width:100%;border-collapse:collapse;margin-top:10px}
th,td{border:1px solid #333;padding:8px;font-size:13px}
th{background:#00ff88;color:#000}
button{background:#00ff88;color:#000;border:0;padding:10px 15px;border-radius:8px;font-weight:bold;margin:5px}
</style>
</head>
<body>
<h1>🛡️ Live DLs ADMIN</h1>
<div class="card">
Users: <span id="uCount">loading...</span><br><br>
<button onclick="loadUsers()">REFRESH</button>
<button onclick="window.location.href='index.html'">Go to Site</button>
</div>
<div class="card">
<h3>All Users</h3>
<table><tr><th>Phone</th><th>Balance</th><th>Password</th></tr>
<tbody id="userTable"><tr><td colspan=3>Loading...</td></tr></tbody></table>
</div>
<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js";
import {getFirestore, collection, getDocs} from "https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore.js";
const firebaseConfig = {
  apiKey: "AIzaSyDSGfITcfwHx_90dM4TqjENNYbcSzo2uV0",
  authDomain: "live-dls-kenya.firebaseapp.com",
  projectId: "live-dls-kenya",
  storageBucket: "live-dls-kenya.firebasestorage.app",
  messagingSenderId: "614038679429",
  appId: "1:614038679429:web:9e6bfebfefcdd72a7b9eec"
};
const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
window.loadUsers = async () => {
  try {
    const snap = await getDocs(collection(db, "users"));
    document.getElementById("uCount").innerText = snap.size;
    let html=""; snap.forEach(doc=>{
      const d=doc.data();
      html+=`<tr><td>${doc.id}</td><td>${d.balance||0}</td><td>${d.password||'***'}</td></tr>`;
    });
    document.getElementById("userTable").innerHTML = html || "<tr><td colspan=3>No users yet - register on main site</td></tr>";
  } catch(e){ alert("Error: "+e.message); }
}
loadUsers();
</script>
</body>
</html>
