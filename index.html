<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ElitebetAfrica</title><style>_{margin:0;padding:0;box-sizing:border-box;font-family:Arial}body{background:#121212;color:#fff;padding-bottom:200px}header{background:#1a1a1a;padding:10px;display:flex;justify-content:space-between;align-items:center}.logo{color:#ffcc00;font-weight:bold;font-size:20px}.bal{background:#ffcc00;color:#000;padding:5px 10px;border-radius:4px;font-weight:bold}.nav{display:flex;gap:10px;padding:10px;background:#222;overflow:auto}.nav button{background:#333;color:#fff;border:none;padding:8px 12px;border-radius:4px}.match{background:#1e1e1e;margin:8px;padding:10px;border-radius:6px}.teams{font-weight:bold;margin-bottom:8px}.odds{display:flex;gap:8px}.odds button{flex:1;background:#2a2a2a;color:#fff;border:1px solid #444;padding:10px;border-radius:4px}.odds button.active{background:#ffcc00;color:#000;font-weight:bold}.betslip{position:fixed;bottom:0;left:0;right:0;background:#1a1a1a;padding:12px;border-top:2px solid #ffcc00}.pot{max-height:120px;overflow:auto;margin-bottom:8px}.bet-item{display:flex;justify-content:space-between;background:#2a2a2a;padding:6px;margin:3px 0;border-radius:3px;font-size:13px}.btn{width:100%;background:#ffcc00;color:#000;border:none;padding:12px;font-weight:bold;border-radius:6px;margin-top:5px}.small{font-size:12px;color:#aaa;margin-top:4px}#loginM{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.8);display:flex;justify-content:center;align-items:center;z-index:10}.box{background:#222;padding:20px;border-radius:8px;width:90%;max-width:300px}.box input{width:100%;padding:10px;margin:8px 0;border-radius:4px;border:none}.box button{width:100%;padding:10px;background:#ffcc00;border:none;font-weight:bold;border-radius:4px}.hidden{display:none!important}</style></head><body><header><div class="logo">ElitebetAfrica</div><div><span id="uName">Guest</span> <span class="bal" id="uBal">0.00</span></div></header><div class="nav"><button onclick="render()">Soccer</button><button onclick="login()">Login</button><button onclick="reg()">Register</button><button onclick="deposit()">Deposit</button><button onclick="withdraw()">Withdraw</button></div><div id="games"></div><div class="betslip"><div class="pot" id="pot"></div><div>Stake: <input id="stake" type="number" value="100" style="width:80px;padding:4px"> <span id="totalOdds">Odds: 1.00</span></div><div id="win">Potential Win: KES 0.00</div><button class="btn" onclick="place()">PLACE BET</button><div class="small">M-PESA TO: 0112678036 | Tap yellow again to UNSELECT | Multibet multiplies!</div></div><div id="loginM" class="hidden"><div class="box"><h3 id="mTitle">Login</h3><input id="lUser" placeholder="Phone"><button onclick="doAuth()">Continue</button><button onclick="document.getElementById('loginM').classList.add('hidden')" style="background:#444;color:#fff;margin-top:6px">Close</button></div></div><script>let bal=Number(localStorage.getItem('eb_bal')||0);let user=localStorage.getItem('eb_user')||'Guest';let bets=[];const matches=[{id:1,teams:'Arsenal vs Chelsea',o1:2.8,ox:3.1,o2:2.5},{id:2,teams:'Man Utd vs Liverpool',o1:2.5,ox:3.2,o2:2.9},{id:3,teams:'Barcelona vs Real Madrid',o1:2.1,ox:3.5,o2:3.2},{id:4,teams:'Bayern vs Dortmund',o1:1.9,ox:3.6,o2:3.8},{id:5,teams:'PSG vs Man City',o1:2.4,ox:3.3,o2:2.8}];function render(){let h='';matches.forEach(m=>{h+=`<div class="match"><div class="teams">${m.teams}</div><div class="odds"><button id="b-${m.id}-1" onclick="pick(${m.id},'1',${m.o1},'${m.teams} - 1')"><div>1</div><div>${m.o1}</div></button><button id="b-${m.id}-X" onclick="pick(${m.id},'X',${m.ox},'${m.teams} - X')"><div>X</div><div>${m.ox}</div></button><button id="b-${m.id}-2" onclick="pick(${m.id},'2',${m.o2},'${m.teams} - 2')"><div>2</div><div>${m.o2}</div></button></div></div>`});document.getElementById('games').innerHTML=h;updatePot()}function pick(id,sel,odd,label){let idx=bets.findIndex(b=>b.id===id);if(idx!==-1){if(bets.sel===sel){bets.splice(idx,1);}else{bets={id,sel,odd,label}} }else{bets.push({id,sel,odd,label})}updatePot();document.querySelectorAll('.odds button').forEach(b=>b.classList.remove('active'));bets.forEach(b=>{let el=document.getElementById(b-${b.id}-${b.sel});if(el)el.classList.add('active')})}function updatePot(){let pot=document.getElementById('pot');let odd=1;let h='';bets.forEach(b=>{odd_=b.odd;h+=`<div class="bet-item"><span>${b.label}</span><span>${b.odd}</span></div>`});if(bets.length===0){h='<div class="small">No bets. Tap odds to add. Tap again to remove.</div>';odd=1}pot.innerHTML=h;let stake=Number(document.getElementById('stake').value||0);document.getElementById('totalOdds').innerText='Odds: '+odd.toFixed(2)+(bets.length>1?` (MULTIBET x${bets.length})`: '');document.getElementById('win').innerText=`Potential Win: KES ${(stake*odd).toFixed(2)} @ ${odd.toFixed(2)} odds ${bets.length>1?`(MULTIBET x${bets.length})`:''}`}document.getElementById('stake').addEventListener('input',updatePot);function place(){let stake=Number(document.getElementById('stake').value);if(bets.length===0)return alert('Add at least 1 bet');if(stake>bal)return alert('Low balance. Deposit to 0112678036. Balance: '+bal.toFixed(2));bal-=stake;localStorage.setItem('eb_bal',bal);document.getElementById('uBal').innerText=bal.toFixed(2);alert(Bet placed! Stake KES ${stake} - Good luck!);bets=[];updatePot();document.querySelectorAll('.odds button').forEach(b=>b.classList.remove('active'))}function deposit(){let a=prompt('M-PESA SEND TO: 0112678036\nEnter amount you sent:');if(a){bal+=Number(a);localStorage.setItem('eb_bal',bal);document.getElementById('uBal').innerText=bal.toFixed(2);alert('KES '+a+' added!')}}function withdraw(){let a=prompt('Enter withdraw amount:');if(a&&Number(a)<=bal){bal-=Number(a);localStorage.setItem('eb_bal',bal);document.getElementById('uBal').innerText=bal.toFixed(2);alert('Withdraw KES '+a+' to M-PESA '+user)}}function login(){document.getElementById('mTitle').innerText='Login';document.getElementById('loginM').classList.remove('hidden')}function reg(){document.getElementById('mTitle').innerText='Register - 500 Bonus!';document.getElementById('loginM').classList.remove('hidden')}function doAuth(){let u=document.getElementById('lUser').value;if(!u)return alert('Enter phone');localStorage.setItem('eb_user',u);if(document.getElementById('mTitle').innerText.includes('Register')){bal=500;localStorage.setItem('eb_bal','500')}user=u;document.getElementById('uName').innerText=u;document.getElementById('uBal').innerText=bal.toFixed(2);document.getElementById('loginM').classList.add('hidden')}document.getElementById('uName').innerText=user;document.getElementById('uBal').innerText=bal.toFixed(2);render();</script></body></html>
