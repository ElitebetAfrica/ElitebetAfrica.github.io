<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ElitebetAfrica - Bet & Win</title>
<style>
body{background:#121212;color:#fff;font-family:Arial;margin:0}
.header{background:#1a1a1a;padding:12px 15px;display:flex;justify-content:space-between;align-items:center;border-bottom:2px solid #ffcc00;position:sticky;top:0;z-index:10}
.logo{font-weight:bold;color:#ffcc00;font-size:20px}
.btn{padding:8px 14px;border:none;border-radius:4px;cursor:pointer;font-weight:bold}
.btn-yellow{background:#ffcc00;color:#000}
.btn-green{background:#00c853;color:#fff}
#welcome{background:#222;padding:10px;text-align:center;font-size:14px;color:#ffcc00}
.matches{padding:10px}
.match{background:#1e1e1e;margin-bottom:10px;padding:12px;border-radius:8px;border-left:3px solid #ffcc00}
.mteams{font-weight:bold;margin-bottom:8px}
.odds{display:flex;gap:6px;flex-wrap:wrap}
.odd{background:#2a2a2a;padding:6px 10px;border-radius:4px;cursor:pointer;border:1px solid #333}
.odd:hover{background:#ffcc00;color:#000}
.betslip{background:#1a1a1a;padding:12px;position:fixed;bottom:0;left:0;right:0;border-top:2px solid #ffcc00;max-height:50vh;overflow:auto}
.modal{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.8);z-index:100;justify-content:center;align-items:center}
.modal.show{display:flex}
.modalBox{background:#222;padding:20px;border-radius:10px;width:90%;max-width:350px;border:1px solid #ffcc00}
input{width:100%;padding:10px;margin:8px 0;background:#111;border:1px solid #444;color:#fff;border-radius:4px;box-sizing:border-box}
</style>
</head>
<body>
<div class="header">
<div class="logo">ElitebetAfrica</div>
<div>
<button id="loginBtn" class="btn btn-yellow" onclick="openLogin()">Login</button>
<button id="regBtn" class="btn btn-green" onclick="openReg()">Register</button>
<button id="logoutBtn" class="btn" style="background:#444;color:#fff;display:none" onclick="doLogout()">Logout</button>
</div>
</div>
<div id="welcome">Login to bet - One PIN per number</div>
<div class="matches" id="matches"></div>
<div class="betslip" id="betslip" style="display:none">
<div id="betItems"></div>
<div style="margin-top:10px;display:flex;gap:5px">
<input id="stake" type="number" placeholder="Stake KES" style="flex:1" oninput="calcWin()">
<span id="potential" style="line-height:40px">Win: 0</span>
</div>
<button class="btn btn-green" style="width:100%;margin-top:10px" onclick="placeBet()">Place Bet</button>
</div>
<div class="modal" id="loginModal">
<div class="modalBox">
<h3 style="color:#ffcc00">Login</h3>
<input id="loginPhone" placeholder="Phone e.g 0712345678">
<input id="loginPin" type="password" placeholder="Your ONE PIN">
<div id="loginMsg" style="color:#ff4444;font-size:13px"></div>
<button class="btn btn-yellow" style="width:100%;margin-top:10px" onclick="doLogin()">Login</button>
<button class="btn" style="width:100%;margin-top:5px;background:#333;color:#fff" onclick="closeModals()">Cancel</button>
</div>
</div>
<div class="modal" id="regModal">
<div class="modalBox">
<h3 style="color:#00c853">Register - One PIN Only</h3>
<input id="regPhone" placeholder="Phone e.g 0712345678">
<input id="regPin" type="password" placeholder="Create ONE PIN (cannot change)">
<div id="regMsg" style="color:#ff4444;font-size:13px"></div>
<button class="btn btn-green" style="width:100%;margin-top:10px" onclick="doReg()">Register</button>
<button class="btn" style="width:100%;margin-top:5px;background:#333;color:#fff" onclick="closeModals()">Cancel</button>
</div>
</div>
<script>
let curUser = null;
let selectedBets = [];
try{curUser = JSON.parse(localStorage.getItem('elite_current'));}catch(e){}
function openLogin(){document.getElementById('loginModal').classList.add('show')}
function openReg(){document.getElementById('regModal').classList.add('show')}
function closeModals(){
 document.getElementById('loginModal').classList.remove('show');
 document.getElementById('regModal').classList.remove('show');
}

 let phone=document.getElementById('regPhone').value.trim();
 let pin=document.getElementById('regPin').value.trim();
 let msg=document.getElementById('regMsg');
 if(phone=='' || pin==''){msg.innerText='Fill phone and PIN!';return;}
 if(phone.length<10){msg.innerText='Invalid phone!';return;}
 if(pin.length<4){msg.innerText='PIN min 4 chars!';return;}
 let users=[];
 try{
