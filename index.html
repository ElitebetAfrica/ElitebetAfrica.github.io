<title>ElitebetAfrica</title><style>body{background:#0f0a1e;color:#fff;font-family:sans-serif;margin:0}header{background:#1a1033;padding:12px;display:flex;justify-content:space-between;align-items:center}.logo{font-weight:900;font-size:20px}.match{background:#1a1033;margin:8px;padding:12px;border-radius:8px;border:1px solid #2a1f4d}.odds{display:flex;gap:6px;margin-top:8px}.odds button{flex:1;padding:10px;background:#2a1f4d;border:none;color:#fff;border-radius:6px}.odds button.sel{background:#22c55e;color:#000}.betslip{position:fixed;bottom:0;left:0;right:0;background:#1a1033;padding:12px;border-top:2px solid #a855f7}.modal{position:fixed;inset:0;background:rgba(0,0,0,0.8);display:none;align-items:center;justify-content:center;z-index:99}.modal.show{display:flex}.box{background:#1a1033;padding:20px;border-radius:12px;width:90%;max-width:320px}.box input{width:100%;padding:12px;margin:6px 0;background:#2a1f4d;border:none;color:#fff;border-radius:6px;box-sizing:border-box}.box button{width:100%;padding:12px;margin-top:8px;border:none;border-radius:6px;font-weight:900}</style><body><header><div class="logo">⚽ ElitebetAfrica</div><div><span id="uName">Guest</span> | <span id="uBal">0.00</span> KES <button onclick="document.getElementById('loginM').classList.add('show')" style="background:#a855f7;color:#fff;border:none;padding:6px 12px;border-radius:6px;margin-left:8px">Login</button></div></header><div style="padding:8px"><button onclick="dep()" style="background:#22c55e;color:#000;border:none;padding:10px 16px;border-radius:6px;font-weight:900">Deposit M-Pesa</button> <span style="font-size:12px;opacity:0.7">→ Send to 0112678036</span></div><div id="matches"></div><div class="betslip"><div id="bsCount">0 selections</div><div style="display:flex;gap:8px;margin-top:8px"><input id="stake" type="number" value="50" style="flex:1;padding:10px;background:#2a1f4d;border:none;color:#fff;border-radius:6px"><button onclick="placeBet()" style="flex:1;background:#a855f7;color:#fff;border:none;padding:10px;border-radius:6px;font-weight:900">Place Bet</button></div><div id="potential" style="margin-top:6px;font-size:13px;color:#22c55e"></div></div><div id="loginM" class="modal"><div class="box"><h3>Login / Register</h3><input id="lUser" placeholder="Phone / Username"><input id="lPass" type="password" placeholder="Password"><button onclick="login()" style="background:#a855f7;color:#fff">Login</button><button onclick="reg()" style="background:#2a1f4d;color:#fff">Register - Get 500 Bonus</button><button onclick="this.closest('.modal').classList.remove('show')" style="background:transparent;color:#fff;opacity:0.5">Close</button></div></div><script>let bets=[];let bal=parseFloat(localStorage.getItem('eb_bal')||'0');let user=localStorage.getItem('eb_user')||'Guest';document.getElementById('uBal').innerText=bal.toFixed(2);document.getElementById('uName').innerText=user;let matches=[{id:1,home:'Gor Mahia',away:'AFC Leopards',odds:[2.1,3.2,2.9]},{id:2,home:'Arsenal',away:'Man City',odds:[2.8,3.1,2.5]},{id:3,home:'Atletico Madrid',away:'Barcelona',odds:[2.4,3.3,2.7]}];function render(){let h='';matches.forEach(m=>{h+='<div class="match"><div style="font-weight:900">'+m.home+' vs '+m.away+'</div><div class="odds"><button onclick="addBet('+m.id+',0,'+m.odds[0]+',\''+m.home+'\')">1 '+m.odds[0]+'</button><button onclick="addBet('+m.id+',1,'+m.odds[1]+',\'Draw\')">X '+m.odds[1]+'</button><button onclick="addBet('+m.id+',2,'+m.odds[2]+',\''+m.away+'\')">2 '+m.odds[2]+'</button></div></div>';});document.getElementById('matches').innerHTML=h;}function addBet(id,type,odd,label){let idx=bets.findIndex(b=>b.id===id);if(idx>=0)bets[idx]={id,type,odd,label};else bets.push({id,type,odd,label});update();}function update(){document.getElementById('bsCount').innerText=bets.length+' selections';let total=1;bets.forEach(b=>total_=b.odd);let stake=parseFloat(document.getElementById('stake').value||0);document.getElementById('potential').innerText=bets.length?('Potential Win: '+(total_stake).toFixed(2)+' KES @ '+(total.toFixed(2))+' odds'):'';document.querySelectorAll('.odds button').forEach(b=>b.classList.remove('sel'));}function placeBet(){if(!bets.length)return alert('Select odds!');let stake=parseFloat(document.getElementById('stake').value);if(stake>bal)return alert('Deposit first! Balance: '+bal);bal-=stake;localStorage.setItem('eb_bal',bal);document.getElementById('uBal').innerText=bal.toFixed(2);alert('Bet placed! Good luck!');bets=[];update();}function dep(){alert('M-PESA DEPOSIT:\n\n1. Go to M-Pesa\n2. Lipa na M-Pesa\n3. Buy Goods & Services\nOR Send Money to:\n0112678036\n\n4. Enter Amount\n5. After payment, WhatsApp 0112678036 with M-Pesa code to credit account');let amt=prompt('Enter amount you sent to 0112678036:');if(amt){bal+=parseFloat(amt);localStorage.setItem('eb_bal',bal);document.getElementById('uBal').innerText=bal.toFixed(2);alert('Balance updated! If not received, WhatsApp 0112678036');}}function login(){let u=document.getElementById('lUser').value;if(!u)return alert('Enter phone');user=u;localStorage.setItem('eb_user',u);document.getElementById('uName').innerText=u;document.getElementById('loginM').classList.remove('show');}function reg(){let u=document.getElementById('lUser').value;if(!u)return alert('Enter phone to register');user=u;bal=500;localStorage.setItem('eb_user',u);localStorage.setItem('eb_bal',bal);document.getElementById('uName').innerText=u;document.getElementById('uBal').innerText=bal.toFixed(2);document.getElementById('loginM').classList.remove('show');alert('Welcome! 500 KES bonus added!');}render();</script>
