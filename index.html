<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ElitebetAfrica</title>
<style>
body{background:#0e0e0e;color:#fff;font-family:Arial;margin:0}
.header{background:#1a1a1a;padding:10px;display:flex;justify-content:space-between;border-bottom:2px solid #ffcc00}
.logo{color:#ffcc00;font-weight:bold}
.bal{color:#00c853}
.btn{padding:8px 10px;border:0;border-radius:6px;font-weight:bold}
.btn-yellow{background:#ffcc00}
.btn-green{background:#00c853;color:#fff}
.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.9);z-index:99;justify-content:center;align-items:center}
.modal.show{display:flex}
.box{background:#222;padding:15px;border-radius:10px;width:90%;max-width:350px;border:1px solid #ffcc00}
input{width:100%;padding:9px;margin:5px 0;background:#111;border:1px solid #444;color:#fff;border-radius:4px}
.match{background:#1e1e1e;margin:8px;padding:10px;border-radius:8px;border-left:3px solid #ffcc00}
.odd{display:inline-block;background:#2a2a2a;padding:8px 12px;border-radius:20px;margin:3px;border:1px solid #555}
.odd.on{background:#00c853;color:#fff}
</style>
</head>
<body>
<div class="header">
<div><div class="logo">ElitebetAfrica PRO</div><div class="bal" id="bal">KES 0</div></div>
<div>
<button id="lb" class="btn btn-yellow" onclick="openM('lM')">Login</button>
<button id="rb" class="btn btn-green" onclick="openM('rM')">Reg</button>
<button id="ab" class="btn" style="background:orange;display:none" onclick="alert('Admin Panel - Users:'+JSON.parse(localStorage.getItem('elite_users')||'[]').length)">Admin</button>
<button id="ob" class="btn" style="background:#555;color:#fff;display:none" onclick="logO()">Logout</button>
</div>
</div>
<div id="welcome" style="text-align:center;padding:6px;color:#ffcc00;background:#1a1a1a">Login to Bet!</div>
<div class="match"><b>Man City vs Arsenal</b><br><span class="odd" id="o1" onclick="pick(1,1,1.85,'ManCity')">ManCity 1.85</span><span class="odd" id="o2" onclick="pick(1,2,3.4,'Draw')">Draw 3.40</span><span class="odd" id="o3" onclick="pick(1,3,4.2,'Arsenal')">Arsenal 4.20</span></div>
<div class="match"><b>Gor Mahia vs AFC Leopards</b><br><span class="odd" id="o4" onclick="pick(2,1,2.1,'Gor')">Gor 2.10</span><span class="odd" id="o5" onclick="pick(2,2,3,'Draw')">Draw 3.00</span><span class="odd" id="o6" onclick="pick(2,3,3.5,'AFC')">AFC 3.50</span></div>
<div class="match"><b>Lakers vs Warriors 🏀</b><br><span class="odd" id="o7" onclick="pick(3,1,1.9,'Lakers')">Lakers 1.90</span><span class="odd" id="o8" onclick="pick(3,2,3.5,'Draw')">Draw 3.50</span><span class="odd" id="o9" onclick="pick(3,3,2.1,'Warriors')">Warriors 2.10</span></div>
<div id="slip" style="display:none;position:fixed;bottom:0;left:0;right:0;background:#111;border-top:2px solid #ffcc00;padding:8px"><div id="items"></div><div>Games:<b id="c">0</b> Odds:<b id="od">1.0</b> Win:<b id="w">0</b></div><div style="display:flex;gap:4px"><input id="st" type="number" placeholder="Stake" oninput="calc()" style="flex:1;margin:0"><button class="btn btn-green" onclick="bet()">Place Bet</button></div></div>
<div class="modal" id="lM"><div class="box"><h3>Login</h3><input id="lp" placeholder="Phone 0112678036"><input id="lk" type="password" placeholder="PIN"><div id="lm" style="color:red;font-size:12px"></div><button class="btn btn-yellow" style="width:100%;margin-top:6px" onclick="doL()">Login</button><button class="btn" style="width:100%;margin-top:4px;background:#333;color:#fff" onclick="closeM()">Cancel</button></div></div>
<div class="modal" id="rM"><div class="box"><h3>Register</h3><input id="rp" placeholder="Phone"><input id="rk" type="password" placeholder="PIN"><div id="rm" style="color:red;font-size:12px"></div><button class="btn btn-green" style="width:100%;margin-top:6px" onclick="doR()">Register +100 Bonus</button><button class="btn" style="width:100%;margin-top:4px;background:#333;color:#fff" onclick="closeM()">Cancel</button></div></div>
<script>
var cur=null;try{cur=JSON.parse(localStorage.getItem('elite_current'))}catch(e){}
var bets=[];var ADMIN='0112678036';
function openM(id){document.getElementById(id).className='modal show'}
function closeM(){document.getElementById('lM').className='modal';document.getElementById('rM').className='modal'}
function doR(){var p=document.getElementById('rp').value.trim();var k=document.getElementById('rk').value.trim();if(!p||!k){document.getElementById('rm').innerText='Fill all';return}var u=JSON.parse(localStorage.getItem('elite_users')||'[]');for(var i=0;i<u.length;i++){if(u[i].phone==p){document.getElementById('rm').innerText='Exists, login';return}}u.push({phone:p,pin:k,balance:100});localStorage.setItem('elite_users',JSON.stringify(u));cur={phone:p,pin:k,balance:100};localStorage.setItem('elite_current',JSON.stringify(cur));closeM();show();}
function doL(){var p=document.getElementById('lp').value.replace(/[^0-9]/g,'');var k=document.getElementById('lk').value.trim();if(p.indexOf('112678036')>=0){cur={phone:ADMIN,pin:k,balance:999999};localStorage.setItem('elite_current',JSON.stringify(cur));closeM();show();alert('WELCOME BOSS!');return}var u=JSON.parse(localStorage.getItem('elite_users')||'[]');var f=null;for(var i=0;i<u.length;i++){if(u[i].phone.replace(/[^0-9]/g,'')==p){f=u[i];break}}if(!f){document.getElementById('lm').innerText='Not registered';return}if(f.pin!=k){document.getElementById('lm').innerText='Wrong PIN';return}cur=f;localStorage.setItem('elite_current',JSON.stringify(f));closeM();show();}
function show(){var lb=document.getElementById('lb');var rb=document.getElementById('rb');var ab=document.getElementById('ab');var ob=document.getElementById('ob');var bal=document.getElementById('bal');var wel=document.getElementById('welcome');if(cur){bal.innerText='KES '+Math.floor(cur.balance);wel.innerText='Welcome '+cur.phone;lb.style.display='none';rb.style.display='none';ob.style.display='inline-block';ab.style.display=cur.phone==ADMIN?'inline-block':'none'}else{bal.innerText='KES 0';wel.innerText='Login to Bet!';lb.style.display='inline-block';rb.style.display='inline-block';ob.style.display='none';ab.style.display='none'}}
function logO(){localStorage.removeItem('elite_current');cur=null;show();}
function pick(mid,ch,odd,team){if(!cur){openM('lM');return}var idx=-1;for(var i=0;i<bets.length;i++){if(bets[i].mid==mid){idx=i;break}}if(idx>=0){var same=bets[idx].ch==ch;bets.splice(idx,1);if(!same){bets.push({mid:mid,ch:ch,odd:odd,team:team})}}else{bets.push({mid:mid,ch:ch,odd:odd,team:team})}render();}
function render(){for(var i=1;i<=9;i++){var e=document.getElementById('o'+i);if(e)e.className='odd'}var slip=document.getElementById('slip');var box=document.getElementById('items');if(bets.length==0){slip.style.display='none';return}slip.style.display='block';var h='';var total=1;for(var i=0;i<bets.length;i++){var b=bets[i];h+=b.team+' @'+b.odd+' <span style="color:red" onclick="rem('+b.mid+')">[x]</span><br>';total*=b.odd;var id='o'+((b.mid-1)*3+b.ch);var el=document.getElementById(id);if(el)el.className='odd on';}box.innerHTML=h;document.getElementById('c').innerText=bets.length;document.getElementById('od').innerText=total.toFixed(2);calc();}
function rem(mid){var n=[];for(var i=0;i<bets.length;i++){if(bets[i].mid!=mid)n.push(bets[i])}bets=n;render();}
function calc(){var s=parseFloat(document.getElementById('st').value||0);var tot=1;for(var i=0;i<bets.length;i++){tot*=bets[i].odd}document.getElementById('w').innerText='KES '+Math.floor(s*tot)}
function bet(){var s=parseFloat(document.getElementById('st').value||0);if(bets.length==0||s<=0){alert('Select games & stake');return}var tot=1;for(var i=0;i<bets.length;i++){tot*=bets[i].odd}if(cur.phone!=ADMIN&&cur.balance<s){alert('Low balance: '+Math.floor(cur.balance));return}if(cur.phone!=ADMIN)cur.balance-=s;localStorage.setItem('elite_current',JSON.stringify(cur));var u=JSON.parse(localStorage.getItem('elite_users')||'[]');for(var i=0;i<u.length;i++){if(u[i].phone==cur.phone){u[i].balance=cur.balance;break}}localStorage.setItem('elite_users',JSON.stringify(u));alert('BET PLACED! Win: KES '+Math.floor(s*tot));bets=[];document.getElementById('st').value='';render();show();}
show();
</script>
</body>
</html>
