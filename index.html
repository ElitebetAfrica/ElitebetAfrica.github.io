<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>LIVE KENYA DLS V5.0 FIXED</title><style>*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui}body{background:#0f0a1e;color:#fff} .header{background:#4a1a8a;padding:12px;display:flex;justify-content:space-between;align-items:center} .logo{font-weight:900;color:#ffeb3b} .wallet{background:#ffeb3b;color:#000;padding:8px 16px;border-radius:20px;font-weight:900} .tabs{display:flex;gap:8px;padding:12px;overflow-x:auto} .tab{padding:8px 16px;border-radius:20px;background:#2a1848;color:#ccc;border:none;font-weight:700} .tab.active{background:#ffeb3b;color:#000} .card{background:#5a2ab8;margin:12px;border-radius:16px;padding:16px} .card2{background:#1e1239;margin:12px;border-radius:16px;padding:16px;border:1px solid #3a2a60} .btn-yellow{background:#ffeb3b;color:#000;border:none;width:100%;padding:14px;border-radius:12px;font-weight:900;font-size:16px;margin-top:10px} .input{width:100%;padding:12px;border-radius:10px;border:none;margin:8px 0} .h1{font-size:32px;font-weight:900;text-align:center} </style></head><body><div class="header"><div><span class="logo">LIVE KENYA DLS V5.0 SAFE</span><div style="font-size:12px;opacity:0.8">Hold My Match Arena</div></div><div class="wallet" id="bal">KES 0.00</div></div><div class="tabs"><button class="tab active" onclick="switchMain('all',this)">All Games</button><button class="tab" onclick="switchMain('dls',this)">DLS Clash</button><button class="tab" onclick="switchMain('avi',this)">Boost Plane</button></div><div id="aviBox" class="card"><div style="text-align:center">✈️ <b>Boost Plane - Fly High</b></div><div class="h1" id="mult">1.00x</div><button class="btn-yellow" id="aviBtn" onclick="aviPlay()">START BOOST</button><div id="aviInfo" style="text-align:center;font-size:12px;margin-top:6px">Place bet 10 KES</div></div><div id="dlsBox" class="card2"><div style="font-weight:900">⚽ DLS - Hold My Match (12% hold)</div><input id="dlsAmt" class="input" type="number" placeholder="Amount 100"><button class="btn-yellow" onclick="createDLS()">+ Create DLS Link</button><div id="dlsLink" style="color:#ffeb3b;font-size:12px;margin-top:8px;word-break:break-all"></div></div><div style="padding:12px"><button class="btn-yellow" style="background:#fff" onclick="openM('reg')">Register / Login</button><button class="btn-yellow" style="background:#2a1848;color:#ffeb3b;border:1px solid #ffeb3b" onclick="openM('dep')">Deposit</button></div><div id="modalReg" style="display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.8);z-index:100;padding:20px"><div class="card2" style="margin-top:60px"><h3>Register</h3><input id="phone" class="input" placeholder="Phone"><input id="pass" class="input" type="password" placeholder="Pass"><button class="btn-yellow" onclick="doR()">Register</button><button class="btn-yellow" style="background:#333;color:#fff" onclick="doL()">Login</button><button class="btn-yellow" style="background:#000;color:#fff" onclick="closeM()">Close</button><div id="regMsg"></div></div></div><div id="modalDep" style="display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.8);z-index:100;padding:20px"><div class="card2" style="margin-top:60px"><h3>Deposit</h3><input id="depAmt" class="input" type="number" placeholder="100"><button class="btn-yellow" onclick="doD()">Deposit</button><button class="btn-yellow" style="background:#000;color:#fff" onclick="closeM()">Close</button><div id="depMsg"></div></div></div><script>var cur=null;try{cur=JSON.parse(localStorage.getItem('elite_cur')||'null')}catch(e){}function showW(){var b=document.getElementById('bal');if(cur&&cur.balance)b.innerText='KES '+parseFloat(cur.balance).toFixed(2)}function switchMain(t,el){document.querySelectorAll('.tab').forEach(b=>b.classList.remove('active'));if(el)el.classList.add('active');var a=document.getElementById('aviBox'),d=document.getElementById('dlsBox');if(t==='all'){a.style.display='block';d.style.display='block'}else if(t==='avi'){a.style.display='block';d.style.display='none'}else{d.style.display='block';a.style.display='none'}}function openM(id){if(id==='reg')document.getElementById('modalReg').style.display='block';if(id==='dep')document.getElementById('modalDep').style.display='block'}function closeM(){document.getElementById('modalReg').style.display='none';document.getElementById('modalDep').style.display='none'}function doR(){var ph=document.getElementById('phone').value,pw=document.getElementById('pass').value;var users=JSON.parse(localStorage.getItem('elite_users')||'[]');var u={phone:ph,password:pw,balance:0};users.push(u);localStorage.setItem('elite_users',JSON.stringify(users));localStorage.setItem('elite_cur',JSON.stringify(u));cur=u;showW();closeM()}function doL(){var ph=document.getElementById('phone').value,pw=document.getElementById('pass').value;var users=JSON.parse(localStorage.getItem('elite_users')||'[]');var u=users.find(x=>x.phone===ph&&x.password===pw);if(!u){document.getElementById('regMsg').innerText='Wrong';return}localStorage.setItem('elite_cur',JSON.stringify(u));cur=u;showW();closeM()}function doD(){var amt=parseFloat(document.getElementById('depAmt').value);if(!cur){openM('reg');return}cur.balance=(cur.balance||0)+amt;var users=JSON.parse(localStorage.getItem('elite_users')||'[]');var i=users.findIndex(x=>x.phone===cur.phone);if(i>=0)users[i]=cur;localStorage.setItem('elite_users',JSON.stringify(users));localStorage.setItem('elite_cur',JSON.stringify(cur));showW();closeM()}var aviMult=1,aviRunning=false,aviTimer=null;function aviPlay(){if(aviRunning)return;if(!cur){openM('reg');return}if((cur.balance||0)<10){alert('Deposit first');return}aviRunning=true;aviMult=1;cur.balance-=10;showW();document.getElementById('aviBtn').innerText='CASHOUT';document.getElementById('aviBtn').onclick=aviCash;aviTimer=setInterval(()=>{aviMult+=0.08+Math.random()*0.12;document.getElementById('mult').innerText=aviMult.toFixed(2)+'x';if(Math.random()<0.08)aviCrash()},200)}function aviCash(){if(!aviRunning)return;clearInterval(aviTimer);var win=10*aviMult;cur.balance+=win;localStorage.setItem('elite_cur',JSON.stringify(cur));showW();document.getElementById('aviInfo').innerText='Won KES '+win.toFixed(2);document.getElementById('aviBtn').innerText='START BOOST';document.getElementById('aviBtn').onclick=aviPlay;aviRunning=false}function aviCrash(){clearInterval(aviTimer);aviRunning=false;document.getElementById('aviInfo').innerText='Crashed at '+aviMult.toFixed(2)+'x';document.getElementById('aviBtn').innerText='START BOOST';document.getElementById('aviBtn').onclick=aviPlay}function createDLS(){var amt=document.getElementById('dlsAmt').value||100;var code='LKD'+Math.floor(10000+Math.random()*90000);var link='https://elitebetafrica.github.io/?dls='+code+'&amt='+amt;document.getElementById('dlsLink').innerText=link}showW();</script></body></html>
