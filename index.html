<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>EliteBet V3.1</title><style>*{margin:0;padding:0;box-sizing:border-box}body{background:#0a0e13;color:#fff;font-family:system-ui;padding-bottom:90px}.header{background:#111820;padding:12px 16px;display:flex;justify-content:space-between;border-bottom:1px solid #1e2a38}.logo{font-weight:900;color:#00ff88;font-size:20px}.match-card{background:#151e29;margin:10px;border-radius:14px;padding:12px;border:1px solid #1e2a38}.match-head{display:flex;justify-content:space-between;font-size:11px;color:#8a9bb0;margin-bottom:10px}.teams{display:flex;justify-content:space-between;align-items:center}.team{display:flex;flex-direction:column;align-items:center;gap:6px;width:90px;text-align:center}.team img{width:44px;height:44px;object-fit:contain;background:#fff;border-radius:50%;padding:4px}.odds{display:flex;gap:8px;margin-top:12px}.odd-btn{flex:1;background:#1f2d3d;border:1px solid #2a3a4e;color:#cbd6e2;padding:10px 4px;border-radius:10px;text-align:center}.odd-btn b{display:block;color:#fff}.odd-btn.selected{background:#00ff88!important;color:#000!important;border-color:#00ff88!important;transform:scale(1.05);box-shadow:0 0 15px rgba(0,255,136,.4)}.odd-btn.selected b{color:#000!important}.bet-slip{position:fixed;bottom:0;left:0;right:0;background:#111820;border-top:2px solid #00ff88;padding:12px;display:none}.bet-slip.show{display:block}.bet-slip button{background:#00ff88;color:#000;width:100%;padding:14px;border:0;border-radius:12px;font-weight:800}</style></head><body><div class="header"><div class="logo">ELITEBET AFRICA</div><div style="font-size:12px">V3.1 REAL LOGOS</div></div><div id="matches"></div><div id="slip" class="bet-slip"><div id="slipText" style="margin-bottom:8px;font-size:13px"></div><button onclick="alert('Bet Placed! '+document.getElementById('totalOdd').textContent)">Place Bet - <span id="totalOdd">0.00</span></button></div><script>const matchesData=[{id:1,league:"Premier League",time:"Today 19:45",home:"Man City",away:"Arsenal",homeId:50,awayId:42,odds:[1.95,3.4,3.8]},{id:2,league:"Premier League",time:"Today 20:00",home:"Liverpool",away:"Chelsea",homeId:40,awayId:49,odds:[2.1,3.3,3.5]},{id:3,league:"LaLiga",time:"Today 21:00",home:"Real Madrid",away:"Barcelona",homeId:541,awayId:529,odds:[2.4,3.5,2.9]},{id:4,league:"Serie A",time:"Tomorrow 18:30",home:"Inter",away:"AC Milan",homeId:505,awayId:489,odds:[2.25,3.2,3.3]},{id:5,league:"Bundesliga",time:"Tomorrow 19:30",home:"Bayern",away:"Dortmund",homeId:157,awayId:165,odds:[1.75,4,4.2]}];let sel={};function logoUrl(id){return `https://media.api-sports.io/football/teams/${id}.png`;}function render(){document.getElementById('matches').innerHTML=matchesData.map(m=>`<div class="match-card"><div class="match-head"><span>${m.league}</span><span>${m.time}</span></div><div class="teams"><div class="team"><img src="${logoUrl(m.homeId)}"><span>${m.home}</span></div><div>VS</div><div class="team"><img src="${logoUrl(m.awayId)}"><span>${m.away}</span></div></div><div class="odds"><div class="odd-btn ${sel[m.id]==0?'selected':''}" onclick="pick(${m.id},0,${m.odds[0]})"><b>${m.odds[0]}</b><small>1</small></div><div class="odd-btn ${sel[m.id]==1?'selected':''}" onclick="pick(${m.id},1,${m.odds[1]})"><b>${m.odds[1]}</b><small>X</small></div><div class="odd-btn ${sel[m.id]==2?'selected':''}" onclick="pick(${m.id},2,${m.odds[2]})"><b>${m.odds[2]}</b><small>2</small></div></div></div>`).join('');}function pick(mid,idx,odd){if(sel[mid]===idx)delete sel[mid];else sel[mid]=idx;sel[mid+'_odd']=odd;render();update();}function update(){const k=Object.keys(sel).filter(x=>!x.includes('_'));const slip=document.getElementById('slip');if(!k.length){slip.classList.remove('show');return;}let tot=1;k.forEach(id=>tot*=sel[id+'_odd']);document.getElementById('totalOdd').textContent=tot.toFixed(2);document.getElementById('slipText').innerHTML=k.length+' selections';slip.classList.add('show');}render();</script></body></html>
