<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ElitebetAfrica</title><style>_{margin:0;padding:0;box-sizing:border-box;font-family:Arial}body{background:#0f0a1e;color:#fff;padding-bottom:120px}header{background:#1a1033;padding:12px 15px;display:flex;justify-content:space-between;align-items:center} .logo{font-weight:900;font-size:23px;color:#a855f7}.logo span{color:#22c55e}.dep{background:#22c55e;color:#000;padding:8px 14px;border:none;border-radius:7px;font-weight:800}.log{background:#a855f7;color:#fff;padding:8px 14px;border:none;border-radius:7px;font-weight:800;margin-left:6px}.bal{background:#251a4a;padding:10px 15px;display:flex;justify-content:space-between;font-size:13px}.match{background:#1e1640;margin:8px;border-radius:12px;padding:12px}.odds{display:flex;gap:6px;margin-top:10px}.odds button{flex:1;background:#2a1f4d;border:1px solid #3a2f5d;padding:11px;border-radius:8px;color:#fff;font-weight:900}.odds button.sel{background:#a855f7}.betslip{position:fixed;bottom:0;left:0;right:0;background:#1a1033;border-top:2px solid #a855f7;padding:12px}.bet-input{display:flex;gap:8px;margin-top:8px}.bet-input input{flex:1;padding:12px;border-radius:8px;border:none;background:#2a1f4d;color:#fff}.bet-input button{flex:1;background:#22c55e;border:none;border-radius:8px;font-weight:900}.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.8);z-index:100;align-items:center;justify-content:center;padding:20px}.modal.show{display:flex}.box{background:#1e1640;width:100%;max-width:340px;border-radius:15px;padding:20px;border:1px solid #a855f7}.box input{width:100%;padding:12px;margin:6px 0;border-radius:8px;border:none;background:#2a1f4d;color:#fff}.box button{width:100%;padding:12px;margin-top:10px;border-radius:8px;border:none;font-weight:900}</style></head><body><header><div class="logo">Elitebet<span>Africa</span></div><div><button class="dep" onclick="openM('depM')">DEPOSIT</button><button class="log" onclick="openM('logM')">LOGIN</button></div></header><div class="bal"><div>Bal: KES <span id="bBal">1,250</span></div><div>Bonus: 500</div></div><div class="match"><div style="color:#a855f7;font-size:11px">PREMIER LIVE 78'</div><div style="display:flex;justify-content:space-between;margin:8px 0"><b>Man City 2</b><b>Arsenal 1</b></div><div class="odds"><button onclick="add(this,'Man City','2.15')">1-2.15</button><button onclick="add(this,'Draw','3.40')">X-3.40</button><button onclick="add(this,'Arsenal','3.10')">2-3.10</button></div></div><div class="match"><div style="color:#a855f7;font-size:11px">FKF 15:00</div><div style="display:flex;justify-content:space-between;margin:8px 0"><b>Gor Mahia</b><b>AFC Leopards</b></div><div class="odds"><button onclick="add(this,'Gor','1.85')">1-1.85</button><button onclick="add(this,'Draw','3.10')">X-3.10</button><button onclick="add(this,'AFC','4.20')">2-4.20</button></div></div><div class="match"><div style="color:#a855f7;font-size:11px">PREMIER 17:30</div><div style="display:flex;justify-content:space-between;margin:8px 0"><b>Man Utd</b><b>Chelsea</b></div><div class="odds"><button onclick="add(this,'Man Utd','2.45')">1-2.45</button><button onclick="add(this,'Draw','3.25')">X-3.25</button><button onclick="add(this,'Chelsea','2.85')">2-2.85</button></div></div><div class="match"><div style="color:#a855f7;font-size:11px">LA LIGA 19:00</div><div style="display:flex;justify-content:space-between;margin:8px 0"><b>Barcelona</b><b>Real Madrid</b></div><div class="odds"><button onclick="add(this,'Barca','2.30')">1-2.30</button><button onclick="add(this,'Draw','3.50')">X-3.50</button><button onclick="add(this,'Real','2.90')">2-2.90</button></div></div><div class="match"><div style="color:#a855f7;font-size:11px">BUNDES 16:30</div><div style="display:flex;justify-content:space-between;margin:8px 0"><b>Bayern</b><b>Dortmund</b></div><div class="odds"><button onclick="add(this,'Bayern','1.95')">1-1.95</button><button onclick="add(this,'Draw','3.60')">X-3.60</button><button onclick="add(this,'Dortmund','3.80')">2-3.80</button></div></div><div style="height:110px"></div><div class="betslip"><div style="display:flex;justify-content:space-between"><b id="slip">Betslip(0)</b><span style="color:#22c55e" id="total">KES 0</span></div><div id="sList" style="font-size:11px;color:#a78bfa;margin:4px 0">Tap odds to add</div><div class="bet-input"><input type="number" id="stake" value="100" oninput="calc()"><button onclick="place()">PLACE BET</button></div></div><div class="modal" id="depM"><div class="box"><h3 style="color:#a855f7;margin-bottom:10px">M-Pesa Deposit</h3><input id="dPhone" placeholder="Phone 07..."><input id="dAmt" type="number" placeholder="Amount"><button style="background:#22c55e" onclick="doDep()">DEPOSIT NOW</button><button style="background:#2a1f4d;color:#fff" onclick="closeM('depM')">Cancel</button></div></div><div class="modal" id="logM"><div class="box"><h3 style="color:#a855f7;margin-bottom:10px">Login</h3><input placeholder="Phone"><input type="password" placeholder="Password"><button style="background:#a855f7;color:#fff" onclick="closeM('logM');alert('Welcome Boss!')">LOGIN</button><button style="background:#2a1f4d;color:#fff" onclick="closeM('logM')">Cancel</button></div></div><script>let bets=[],odds=1;function add(b,t,o){b.classList.toggle('sel');let k=t+'@'+o;let i=bets.indexOf(k);if(i>-1){bets.splice(i,1);odds/=parseFloat(o)}else{bets.push(k);odds_=parseFloat(o)}document.getElementById('slip').innerText='Betslip('+bets.length+')';document.getElementById('sList').innerText=bets.length?bets.join(' | '):'Tap odds';calc()}function calc(){let s=document.getElementById('stake').value||0;document.getElementById('total').innerText='Win KES '+(s*odds).toFixed(2)}function place(){if(!bets.length)return alert('Add bet');alert('BET PLACED!\n'+bets.join('\n'));bets=[];odds=1;document.querySelectorAll('.sel').forEach(x=>x.classList.remove('sel'));calc();document.getElementById('slip').innerText='Betslip(0)';document.getElementById('sList').innerText='Tap odds'}function openM(id){document.getElementById(id).classList.add('show')}function closeM(id){document.getElementById(id).classList.remove('show')}function doDep(){let p=document.getElementById('dPhone').value,a=document.getElementById('dAmt').value;if(!p||!a)return alert('Enter phone & amount');alert('STK Push to '+p+' KES '+a);let bal=document.getElementById('bBal');bal.innerText=(parseInt(bal.innerText)+parseInt(a));closeM('depM')}</script></body></html>
