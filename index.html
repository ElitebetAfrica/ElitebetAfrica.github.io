<!DOCTYPE html><html><head><meta charset=UTF-8><meta name="viewport" content="width=device-width,initial-scale=1"><title>Live DLS</title><style>body{margin:0;background:#0a0a0a;color:#fff;font-family:sans-serif}.h{background:#111;padding:12px;display:flex;justify-content:space-between;border-bottom:2px solid #00ff88}.b{color:#00ff88;font-weight:bold}.w{padding:12px}.c{background:#1a1a1a;padding:12px;border-radius:12px;margin-bottom:12px}.m{background:#1a1a1a;padding:12px;border-radius:12px;margin-bottom:10px;border-left:3px solid #00ff88}.o{display:flex;gap:6px;margin-top:8px}.o button{flex:1;padding:10px;background:#2a2a2a;border:0;color:#fff;border-radius:8px}input{width:90%;padding:12px;background:#222;border:0;color:#fff;border-radius:8px}button.go{width:100%;padding:12px;background:#00ff88;border:0;border-radius:8px;font-weight:bold;margin-top:8px}</style></head><body><div class=h><b>⚽ LIVE DLS KENYA</b><div class=b id=bal>KSH 0.00</div></div><div class=w><div class=c><input id=uid placeholder="Enter ID e.g. LKD23917"><button class=go onclick="login()">LOGIN / CHECK BALANCE</button><div id=msg style="margin-top:6px;font-size:12px;color:#aaa"></div></div><div class=m><b>Man City vs Arsenal - LIVE</b><div class=o><button onclick="bet(1.85)">1 - 1.85</button><button onclick="bet(2.1)">X - 2.1</button><button onclick="bet(3.4)">2 - 3.4</button></div></div><div class=m><b>Gor Mahia vs Leopards - LIVE</b><div class=o><button onclick="bet(2.2)">1 - 2.2</button><button onclick="bet(1.9)">X - 1.9</button><button onclick="bet(3.1)">2 - 3.1</button></div></div><div class=m><b>Barcelona vs Real Madrid</b><div class=o><button onclick="bet(2.05)">1 - 2.05</button><button onclick="bet(3.2)">X - 3.2</button><button onclick="bet(2.95)">2 - 2.95</button></div></div></div><script type=module>import{initializeApp}from"https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js";import{getFirestore,doc,getDoc}from"https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore.js";const firebaseConfig={apiKey:"AIzaSyDSGfITcfwHx_90dM4TqjENNYbcSzo2uV0",authDomain:"live-dls-kenya.firebaseapp.com",projectId:"live-dls-kenya",storageBucket:"live-dls-kenya.firebasestorage.app",messagingSenderId:"614038679429",appId:"1:614038679429:web:9e6bfebfefcdd72a7b9eec"};const app=initializeApp(firebaseConfig);const db=getFirestore(app);window.login=async()=>{let id=document.getElementById("uid").value.trim();if(!id){alert("Enter ID");return}try{let s=await getDoc(doc(db,"holds",id));if(!s.exists()){alert("ID not in holds");return}let b=s.data().balance||s.data().bal||0;document.getElementById("bal").innerText="KSH "+Number(b).toFixed(2);document.getElementById("msg").innerText="Welcome "+id+" Balance KSH "+b}catch(e){alert(e.message)}};window.bet=(o)=>{alert("Bet Odd "+o+" placed!")}</script></body></html>
