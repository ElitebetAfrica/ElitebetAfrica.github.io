<!DOCTYPE html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ElitebetAfrica</title><link rel="manifest" href="manifest.json"><style>body{margin:0;background:#121212;color:#fff;font-family:Arial;padding-bottom:340px}header{background:#1a1a1a;padding:12px;display:flex;justify-content:space-between}.logo{color:#ffcc00;font-weight:bold;font-size:20px}.bal{background:#ffcc00;color:#000;padding:6px 10px;border-radius:4px;font-weight:bold}.match{background:#1e1e1e;margin:8px;padding:12px;border-radius:6px}.teams{color:#ffcc00;font-weight:bold;margin-bottom:10px}.odds{display:flex;gap:8px}.odds button{flex:1;background:#2a2a2a;color:#fff;border:1px solid #555;padding:12px;border-radius:4px}.odds button.active{background:#ffcc00;color:#000}.betslip{position:fixed;bottom:0;left:0;right:0;background:#1a1a1a;padding:12px;border-top:3px solid #ffcc00}.btn{width:100%;background:#ffcc00;color:#000;border:none;padding:14px;font-weight:bold;border-radius:6px;margin-top:8px}</style></head><body><header><div class="logo">ElitebetAfrica</div><div><span id="uName">Guest</span> <span class="bal" id="uBal">0.00</span> <button onclick="openAuth()" style="background:#ffcc00;border:none;padding:6px 10px;border-radius:4px;font-weight:bold;margin-left:4px">Login</button></div></header><div id="games"></div><div class="betslip"><div id="pot">No bets</div><div style="margin:8px 0">Stake:<input id="stake" type="number" value="100" style="width:70px"> <b id="totalOdds" style="color:#ffcc00">Odds:1.00</b></div><div id="win">Win:0</div><button class="btn" onclick="place()">PLACE BET</button><button class="btn" style="background:#333;color:#fff" onclick="openDeposit()">DEPOSIT 0112678036</button></div><div id="authModal" style="position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.85);display:none;justify-content:center;align-items:center;z-index:99"><div style="background:#1e1e1e;padding:20px;border-radius:8px;width:90%;max-width:320px"><h3>Login</h3><input id="phone" placeholder="Phone" style="width:100%;padding:10px;margin:8px 0"><input id="pass" type="password" placeholder="Password" style="width:100%;padding:10px;margin:8px 0"><button class="btn" onclick="doAuth()">Continue</button><button class="btn" style="background:#333;color:#fff" onclick="closeAuth()">Close</button></div></div><div id="depModal" style="position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.85);display:none;justify-content:center;align-items:center;z-index:99"><div style="background:#1e1e1e;padding:20px;border-radius:8px;width:90%;max-width:320px"><h3>Deposit</h3><p>Till: 0112678036</p><input id="depAmt" type="number" placeholder="Amount" style="width:100%;padding:10px;margin:8px 0"><button class="btn" onclick="doDeposit()">Confirm</button><button class="btn" style="background:#333;color:#fff" onclick="closeDeposit()">Close</button></div</div><script>let bets=[];let bal=Number(localStorage.getItem('eb_bal')||0);let user=localStorage.getItem('eb_user')||'Guest';document.getElementById('uBal').innerText=bal.toFixed(2);document.getElementById('uName').innerText=user;const games=[{id:1,teams:'Gor Mahia vs AFC Leopards',odds:{'1':2.10,'X':3.20,'2':2.90}},{id:2,teams:'Man City vs Arsenal',odds:{'1':2.45,'X':3.40,'2':2.75}},{id:3,teams:'Barcelona vs Real Madrid',odds:{'1':2.30,'X':3.50,'2':2.80}}];function render(){const g=document.getElementById('games');g.innerHTML='';games.forEach(m=>{let d=document.createElement('div');d.className='match';d.style.background='#1e1e1e';d.style.margin='8px';d.style.padding='12px';d.style.borderRadius='6px';let t=document.createElement('div');t.style.color='#ffcc00';t.style.fontWeight='bold';t.innerText=m.teams;let o=document.createElement('div');o.style.display='flex';o.style.gap='8px';o.style.marginTop='10px';['1','X','2'].forEach(k=>{let b=document.createElement('button');b.style.flex='1';b.style.background='#2a2a2a';b.style.color='#fff';b.style.border='1px solid #555';b.style.padding='12px';b.style.borderRadius='4px';b.id='b-'+m.id+'-'+k;b.innerText=m.odds+' ('+k+')';b.onclick=function(){addBet(m.id,k,m.odds,m.teams)};o.appendChild(b);});d.appendChild(t);d.appendChild(o);g.appendChild(d);});}function addBet(id,sel,odd,teams){let ex=bets.findIndex(b=>b.id===id);if(ex>=0)bets.splice(ex,1);bets.push({id,sel,odd,teams});updateBetslip();}function updateBetslip(){let pot=document.getElementById('pot');if(bets.length===0){pot.innerText='No bets';document.getElementById('totalOdds').innerText='Odds:1.00';document.getElementById('win').innerText='Win:0';return;}let total=1;let txt='';bets.forEach(b=>{total=total_b.odd;txt+=b.teams+' - '+b.sel+' @'+b.odd+'\n';});pot.innerText=txt;document.getElementById('totalOdds').innerText='Odds:'+total.toFixed(2);let stake=Number(document.getElementById('stake').value||0);document.getElementById('win').innerText='Win:'+(total_stake).toFixed(2);}document.getElementById('stake').addEventListener('input',updateBetslip);function place(){if(bets.length===0)return alert('Select bets');let stake=Number(document.getElementById('stake').value);if(stake>bal)return alert('Low balance');bal-=stake;localStorage.setItem('eb_bal',bal);document.getElementById('uBal').innerText=bal.toFixed(2);alert('Bet placed! '+document.getElementById('win').innerText);bets=[];updateBetslip();}function openAuth(){document.getElementById('authModal').style.display='flex';}function closeAuth(){document.getElementById('authModal').style.display='none';}function doAuth(){let p=document.getElementById('phone').value;if(!p)return alert('Enter phone');localStorage.setItem('eb_user',p);document.getElementById('uName').innerText=p;closeAuth();}function openDeposit(){document.getElementById('depModal').style.display='flex';}function closeDeposit(){document.getElementById('depModal').style.display='none';}function doDeposit(){let a=Number(document.getElementById('depAmt').value);if(!a)return alert('Enter amount');bal+=a;localStorage.setItem('eb_bal',bal);document.getElementById('uBal').innerText=bal.toFixed(2);closeDeposit();}render();</script></body></html>
