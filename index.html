<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ElitebetAfrica</title><style>body{background:#121212;color:#fff;font-family:Arial;margin:0}.header{background:#1a1a1a;padding:12px;display:flex;justify-content:space-between;border-bottom:2px solid #ffcc00;position:sticky;top:0}.logo{color:#ffcc00;font-weight:bold;font-size:20px}.btn{padding:8px 12px;border:0;border-radius:4px;font-weight:bold;cursor:pointer}.btn-yellow{background:#ffcc00}.btn-green{background:#00c853;color:#fff}#welcome{background:#222;padding:10px;text-align:center;color:#ffcc00}.matches{padding:10px}.match{background:#1e1e1e;margin-bottom:10px;padding:10px;border-radius:8px;border-left:3px solid #ffcc00}.odds{display:flex;gap:5px;flex-wrap:wrap}.odd{background:#2a2a2a;padding:6px 8px;border-radius:4px;cursor:pointer}.odd:hover{background:#ffcc00;color:#000}.betslip{background:#1a1a1a;padding:10px;position:fixed;bottom:0;left:0;right:0;border-top:2px solid #ffcc00}.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.8);z-index:99;justify-content:center;align-items:center}.modal.show{display:flex}.modalBox{background:#222;padding:20px;border-radius:10px;width:90%;max-width:350px;border:1px solid #ffcc00}input{width:100%;padding:10px;margin:6px 0;background:#111;border:1px solid #444;color:#fff;border-radius:4px}</style></head><body><div class="header"><div class="logo">ElitebetAfrica</div><div><button id="loginBtn" class="btn btn-yellow" onclick="openLogin()">Login</button><button id="regBtn" class="btn btn-green" onclick="openReg()">Register</button><button id="logoutBtn" class="btn" style="background:#444;color:#fff;display:none" onclick="doLogout()">Logout</button></div></div><div id="welcome">Login to bet - One PIN per number</div><div class="matches" id="matches"></div><div class="betslip" id="betslip" style="display:none"><div id="betItems"></div><div style="display:flex;gap:5px;margin-top:8px"><input id="stake" type="number" placeholder="Stake KES" oninput="calcWin()" style="flex:1"><span id="potential">Win:0</span></div><button class="btn btn-green" style="width:100%;margin-top:8px" onclick="placeBet()">Place Bet</button></div><div class="modal" id="loginModal"><div class="modalBox"><h3 style="color:#ffcc00">Login</h3><input id="loginPhone" placeholder="Phone"><input id="loginPin" type="password" placeholder="Your ONE PIN"><div id="loginMsg" style="color:red;font-size:13px"></div><button class="btn btn-yellow" style="width:100%;margin-top:8px" onclick="doLogin()">Login</button><button class="btn" style="width:100%;margin-top:5px;background:#333;color:#fff" onclick="closeModals()">Cancel</button></div></div><div class="modal" id="regModal"><div class="modalBox"><h3 style="color:#00c853">Register</h3><input id="regPhone" placeholder="Phone"><input id="regPin" type="password" placeholder="One PIN"><div id="regMsg" style="color:red;font-size:13px"></div><button class="btn btn-green" style="width:100%;margin-top:8px" onclick="doReg()">Register</button><button class="btn" style="width:100%;margin-top:5px;background:#333;color:#fff" onclick="closeModals()">Cancel</button></div></div><script>let curUser=null;try{curUser=JSON.parse(localStorage.getItem('elite_current'))}catch(e){}let selectedBets=[];function openLogin(){document.getElementById('loginModal').classList.add('show')}function openReg(){document.getElementById('regModal').classList.add('show')}function closeModals(){document.getElementById('loginModal').classList.remove('show');document.getElementById('regModal').classList.remove('show')}function doReg(){let p=document.getElementById('regPhone').value.trim();let pin=document.getElementById('regPin').value.trim();let m=document.getElementById('regMsg');if(!p||!pin){m.innerText='Fill phone & PIN';return}let users=[];try{users=JSON.parse(localStorage.getItem('elite_users'))||'[]'}catch(e){}for(let i=0;i<users.length;i++)if(users[i].phone==p){m.innerText='Phone exists! Login!';return}users.push({phone:p,pin:pin,balance:100});localStorage.setItem('elite_users',JSON.stringify(users));curUser={phone:p,pin:pin,balance:100};localStorage.setItem('elite_current',JSON.stringify(curUser));closeModals();showWelcome();alert('Registered forever!')}function doLogin(){let p=document.getElementById('loginPhone').value.trim();let pin=document.getElementById('loginPin').value.trim();let m=document.getElementById('loginMsg');let users=[];try{users=JSON.parse(localStorage.getItem('elite_users'))||'[]'}catch(e){}let f=null;for(let i=0;i<users.length;i++)if(users[i].phone==p)f=users[i];if(!f){m.innerText='Not registered';return}if(f.pin!=pin){m.innerText='WRONG PIN!';return}curUser=f;localStorage.setItem('elite_current',JSON.stringify(f));closeModals();showWelcome()}function showWelcome(){let w=document.getElementById('welcome');let a=document.getElementById('loginBtn');let b=document.getElementById('regBtn');let c=document.getElementById('logoutBtn');if(curUser){w.innerText='Welcome '+curUser.phone+' | Bal: KES '+curUser.balance;a.style.display='none';b.style.display='none';c.style.display='inline-block'}else{w.innerText='Login to bet - One PIN';a.style.display='inline-block';b.style.display='inline-block';c.style.display='none'}}function doLogout(){localStorage.removeItem('elite_current');curUser=null;showWelcome();alert('Logged out')}function loadMatches(){let con=document.getElementById('matches');let def=[{id:1,h:'Man City',a:'Arsenal',ho:'1.85',d:'3.40',ao:'4.20'},{id:2,h:'Gor Mahia',a:'AFC Leopards',ho:'2.10',d:'3.00',ao:'3.50'},{id:3,h:'Liverpool',a:'Chelsea',ho:'2.00',d:'3.30',ao:'3.80'}];con.innerHTML='';for(let i=0;i<def.length;i++){let m=def[i];let d=document.createElement('div');d.className='match';d.innerHTML='<b>'+m.h+' vs '+m.a+'</b><div class="odds"><div class="odd" onclick="addBet('+m.id+',\''+m.h+'\',\'Home\',\''+m.ho+'\')">'+m.h+' '+m.ho+'</div><div class="odd" onclick="addBet('+m.id+',\'Draw\',\'Draw\',\''+m.d+'\')">Draw '+m.d+'</div><div class="odd" onclick="addBet('+m.id+',\''+m.a+'\',\'Away\',\''+m.ao+'\')">'+m.a+' '+m.ao+'</div></div>';con.appendChild(d)}}function addBet(id,t,ty,o){if(!curUser){openLogin();return}let nl=[];for(let i=0;i<selectedBets.length;i++)if(selectedBets[i].id!=id)nl.push(selectedBets[i]);selectedBets=nl;selectedBets.push({id:id,team:t,type:ty,odd:parseFloat(o)});renderBets()}function renderBets(){let s=document.getElementById('betslip');let it=document.getElementById('betItems');if(!selectedBets.length){s.style.display='none';return}s.style.display='block';let h='';for(let i=0;i<selectedBets.length;i++){let b=selectedBets[i];h+=b.team+' @'+b.odd+' <span style="color:red" onclick="removeBet('+b.id+')">[x]</span><br>'}it.innerHTML=h;calcWin()}function removeBet(id){let nl=[];for(let i=0;i<selectedBets.length;i++)if(selectedBets[i].id!=id)nl.push(selectedBets[i]);selectedBets=nl;renderBets()}function calcWin(){let v=document.getElementById('stake').value;let st=v?parseFloat(v):0;let to=1;for(let i=0;i<selectedBets.length;i++)to*=selectedBets[i].odd;document.getElementById('potential').innerText='Win:'+(st*to).toFixed(2)}function placeBet(){if(!curUser){openLogin();return}let v=document.getElementById('stake').value;let st=v?parseFloat(v):0;if(!selectedBets.length||st<=0){alert('Add bet & stake');return}let to=1;for(let i=0;i<selectedBets.length;i++)to*=selectedBets[i].odd;if(curUser.balance<st){alert('Low balance');return}curUser.balance-=st;let users=[];try{users=JSON.parse(localStorage.getItem('elite_users'))||'[]'}catch(e){}for(let i=0;i<users.length;i++)if(users[i].phone==curUser.phone)users[i].balance=curUser.balance;localStorage.setItem('elite_users',JSON.stringify(users));localStorage.setItem('elite_current',JSON.stringify(curUser));alert('Bet placed! Win '+(st*to).toFixed(2));selectedBets=[];document.getElementById('stake').value='';renderBets();showWelcome()}showWelcome();loadMatches();</script></body></html>
