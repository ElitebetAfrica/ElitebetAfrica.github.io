<!DOCTYPE html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>ElitebetAfrica</title><style>body{background:#0f0f0f;color:#fff;font-family:Arial;margin:0}header{background:#000;padding:10px;display:flex;justify-content:space-between;border-bottom:2px solid #ffcc00}.logo{color:#ffcc00;font-weight:bold}.match{background:#1e1e1e;margin:8px;padding:12px;border-radius:6px}.betslip{position:fixed;bottom:0;left:0;right:0;background:#000;padding:10px;border-top:2px solid #ffcc00}.btn{background:#ffcc00;color:#000;border:none;padding:12px;width:100%;border-radius:6px;font-weight:bold;margin-top:6px}</style></head><body><header><div class="logo">ElitebetAfrica</div><div><span id="uName">Guest</span> <span id="uBal" style="background:#ffcc00;color:#000;padding:4px 8px;border-radius:4px">0.00</span></div></header><div id="games"></div><div style="height:180px"></div><div class="betslip"><div id="pot">No bets</div><div>Stake:<input id="stake" type="number" value="100" style="width:70px"> <b id="totalOdds" style="color:#ffcc00">Odds:1.00</b></div><div id="win">Win:0</div><button class="btn" onclick="place()">PLACE BET</button><button class="btn" style="background:#333;color:#fff" onclick="openDeposit()">DEPOSIT Till 0112678036</button></div><script>let bets=[];let bal=Number(localStorage.getItem('eb_bal')||0);document.getElementById('uBal').innerText=bal.toFixed(2);const games=[{id:1,teams:'Gor Mahia vs AFC Leopards',odds:{'1':2.1,'X':3.2,'2':2.9}},{id:2,teams:'Man City vs Arsenal',odds:{'1':2.45,'X':3.4,'2':2.75}},{id:3,teams:'Barcelona vs Real Madrid',odds:{'1':2.3,'X':3.5,'2':2.8}}];function render(){let g=document.getElementById('games');g.innerHTML='';games.forEach(m=>{let d=document.createElement('div');d.className='match';let t=document.createElement('div');t.style.color='#ffcc00';t.style.fontWeight='bold';t.innerText=m.teams;let o=document.createElement('div');o.style.display='flex';o.style.gap='8px';o.style.marginTop='10px';['1','X','2'].forEach(k=>{let b=document.createElement('button');b.style.flex='1';b.style.background='#2a2a2a';b.style.color='#fff';b.style.border='1px solid #555';b.style.padding='12px';b.style.borderRadius='4px';b.id='b-'+m.id+'-'+k;b.innerText=m.odds[k]+' ('+k+')';b.onclick=()=>addBet(m.id,k,m.odds[k],m.teams);o.appendChild(b);});d.appendChild(t);d.appendChild(o);g.appendChild(d);});}function addBet(id,sel,odd,teams){bets=bets.filter(x=>x.id!==id);bets.push({id,sel,odd,teams});document.querySelectorAll('#games button').forEach(btn=>{let p=btn.id.split('-');if(p[1]==id){if(p[2]==sel){btn.style.background='#ffcc00';btn.style.color='#000';}else{btn.style.background='#2a2a2a';btn.style.color='#fff';}}});updateBetslip();}function updateBetslip(){let pot=document.getElementById('pot');let tot=document.getElementById('totalOdds');let win=document.getElementById('win');if(bets.length==0){pot.innerText='No bets';tot.innerText='Odds:1.00';win.innerText='Win:0';return;}let total=1;let txt='';bets.forEach(b=>{total_=b.odd;txt+=b.teams+' '+b.sel+' @'+b.odd+'\n';});pot.innerText=txt;tot.innerText='Odds:'+total.toFixed(2);let stake=Number(document.getElementById('stake').value||0);win.innerText='Win:'+(total_stake).toFixed(2);}document.getElementById('stake').addEventListener('input',updateBetslip);function place(){if(bets.length==0)return alert('Select');let stake=Number(document.getElementById('stake').value);if(stake>bal)return alert('Low balance');bal-=stake;localStorage.setItem('eb_bal',bal);document.getElementById('uBal').innerText=bal.toFixed(2);alert('Bet placed '+document.getElementById('win').innerText);bets=[];document.querySelectorAll('#games button').forEach(b=>{b.style.background='#2a2a2a';b.style.color='#fff';});updateBetslip();}function openDeposit(){let a=prompt('Deposit amount:');if(!a)return;bal+=Number(a);localStorage.setItem('eb_bal',bal);document.getElementById('uBal').innerText=bal.toFixed(2);}render();</script></body></html>
