<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ElitebetAfrica</title><style>body{background:#121212;color:#fff;font-family:Arial;margin:0}.header{background:#1a1a1a;padding:12px;display:flex;justify-content:space-between;border-bottom:2px solid #ffcc00;position:sticky;top:0;z-index:10}.logo{color:#ffcc00;font-weight:bold}.btn{padding:8px 12px;border:0;border-radius:4px;font-weight:bold;cursor:pointer}.btn-yellow{background:#ffcc00}.btn-green{background:#00c853;color:#fff}#welcome{background:#222;padding:10px;text-align:center;color:#ffcc00}.matches{padding:10px;padding-bottom:160px}.match{background:#1e1e1e;margin-bottom:10px;padding:12px;border-radius:8px;border-left:3px solid #ffcc00}.odds{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}.odd{background:#2a2a2a;padding:8px 12px;border-radius:20px;cursor:pointer;border:1px solid #555}.odd.sel{background:#00c853;color:#fff;border-color:#00c853}.betslip{background:#1a1a1a;padding:12px;position:fixed;bottom:0;left:0;right:0;border-top:2px solid #ffcc00;z-index:20}.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:99;justify-content:center;align-items:center}.modal.show{display:flex}.modalBox{background:#222;padding:20px;border-radius:10px;width:90%;max-width:350px;border:1px solid #ffcc00}input{width:100%;padding:10px;margin:6px 0;background:#111;border:1px solid #444;color:#fff;border-radius:4px}#adminPanel{display:none;background:#000;padding:15px;border:2px solid red;margin:10px;border-radius:8px}</style></head><body><div class="header"><div class="logo">ElitebetAfrica</div><div><button id="loginBtn" class="btn btn-yellow" onclick="openLogin()">Login</button><button id="regBtn" class="btn btn-green" onclick="openReg()">Register</button><button id="adminBtn" class="btn" style="background:orange;display:none" onclick="openAdmin()">Admin</button><button id="logoutBtn" class="btn" style="background:#444;color:#fff;display:none" onclick="doLogout()">Logout</button></div></div><div id="welcome">Login to bet</div><div id="adminPanel"><h3 style="color:red">ADMIN PANEL</h3><div id="adminStats"></div><br><button class="btn" style="background:red;color:#fff" onclick="clearAll()">Clear Data</button> <button class="btn" style="background:#333;color:#fff" onclick="closeAdmin()">Close</button></div><div class="matches" id="matches"></div><div class="betslip" id="betslip" style="display:none"><div id="betItems" style="font-size:14px"></div><div style="display:flex;gap:6px;margin-top:8px;align-items:center"><input id="stake" type="number" placeholder="Stake KES" oninput="calcWin()" style="flex:1"><span id="potential" style="font-weight:bold">Win: 0</span></div><button class="btn btn-green" style="width:100%;margin-top:8px" onclick="placeBet()">Place Bet</button></div><div class="modal" id="loginModal"><div class="modalBox"><h3 style="color:#ffcc00">Login</h3><input id="loginPhone" placeholder="Phone 0112678036"><input id="loginPin" type="password" placeholder="PIN"><div id="loginMsg" style="color:red;font-size:13px"></div><button class="btn btn-yellow" style="width:100%;margin-top:8px" onclick="doLogin()">Login</button><button class="btn" style="width:100%;margin-top:5px;background:#333;color:#fff" onclick="closeModals()">Cancel</button></div></div><div class="modal" id="regModal"><div class="modalBox"><h3 style="color:#00c853">Register</h3><input id="regPhone" placeholder="Phone"><input id="regPin" type="password" placeholder="Create PIN"><div id="regMsg" style="color:red;font-size:13px"></div><button class="btn btn-green" style="width:100%;margin-top:8px" onclick="doReg()">Register</button><button class="btn" style="width:100%;margin-top:5px;background:#333;color:#fff" onclick="closeModals()">Cancel</button></div></div><script>let curUser=null;try{curUser=JSON.parse(localStorage.getItem('elite_current'))}catch(e){}let selectedBets=[];const ADMIN_PHONE='0112678036';const ADMIN_PIN='Boss1234';const GAMES=[{id:1,h:'Man City',a:'Arsenal',ho:1.85,d:3.4,ao:4.2},{id:2,h:'Gor Mahia',a:'AFC Leopards',ho:2.1,d:3.0,ao:3.5},{id:3,h:'Liverpool',a:'Chelsea',ho:2.0,d:3.3,ao:3.8}];function openLogin(){document.getElementById('loginModal').classList.add('show')}function openReg(){document.getElementById('regModal').classList.add('show')}function closeModals(){document.getElementById('loginModal').classList.remove('show');document.getElementById('regModal').classList.remove('show')}function openAdmin(){document.getElementById('adminPanel').style.display='block';let users=[];let bets=[];try{users=JSON.parse(localStorage.getItem('elite_users'))||'[]'}catch(e){}try{bets=JSON.parse(localStorage.getItem('elite_bets'))||'[]'}catch(e){}let h='Users:'+users.length+' Bets:'+bets.length+'<br><br>';users.forEach(u=>{h+=u.phone+' Bal:'+u.balance+'<br>'});h+='<br>';bets.forEach(b=>{h+=b.phone+' Stake:'+b.stake+'<br>'});document.getElementById('adminStats').innerHTML=h}function closeAdmin(){document.getElementById('adminPanel').style.display='none'}function clearAll(){if(confirm('Clear all?')){localStorage.removeItem('elite_users');localStorage.removeItem('elite_bets');alert('Cleared');openAdmin()}}function doReg(){let p=document.getElementById('regPhone').value.trim();let pin=document.getElementById('regPin').value.trim();let m=document.getElementById('regMsg');if(!p||!pin){m.innerText='Fill!';return}let users=[];try{users=JSON.parse(localStorage.getItem('elite_users'))||'[]'}catch(e){}if(users.some(u=>u.phone==p)){m.innerText='Exists! Login!';return}users.push({phone:p,pin:pin,balance:100});localStorage.setItem('elite_users',JSON.stringify(users));curUser={phone:p,pin:pin,balance:100};localStorage.setItem('elite_current',JSON.stringify(curUser));closeModals();showWelcome();alert('Registered!')}function doLogin(){let p=document.getElementById('loginPhone').value.trim();let pin=document.getElementById('loginPin').value.trim();let m=document.getElementById('loginMsg');if(p==ADMIN_PHONE&&pin==ADMIN_PIN){curUser={phone:p,pin:pin,balance:999999};localStorage.setItem('elite_current',JSON.stringify(curUser));closeModals();showWelcome();openAdmin();alert('WELCOME BOSS ADMIN!');return}let users=[];try{users=JSON.parse(localStorage.getItem('elite_users'))||'[]'}catch(e){}let f=users.find(u=>u.phone==p);if(!f){m.innerText='Not registered';return}if(f.pin!=pin){m.innerText='Wrong PIN!';return}curUser=f;localStorage.setItem('elite_current',JSON.stringify(f));closeModals();showWelcome()}function showWelcome(){let w=document.getElementById('welcome');let a=document.getElementById('loginBtn');let b=document.getElementById('regBtn');let c=document.getElementById('logoutBtn');let ad=document.getElementById('adminBtn');let isAd=curUser&&curUser.phone==ADMIN_PHONE;if(curUser){w.innerText='Welcome '+(isAd?'BOSS ':'')+curUser.phone+' | KES '+curUser.balance;a.style.display='none';b.style.display='none';c.style.display='inline-block';ad.style.display=isAd?'inline-block':'none'}else{w.innerText='Login to bet - One PIN';a.style.display='inline-block';b.style.display='inline-block';c.style.display='none';ad.style.display='none'}}function doLogout(){localStorage.removeItem('elite_current');curUser=null;document.getElementById('adminPanel').style.display='none';showWelcome();alert('Out')}function loadMatches(){let con=document.getElementById('matches');con.innerHTML='';GAMES.forEach(g=>{let sel=selectedBets.find(b=>b.id==g.id);let selType=sel?sel.type:'';let div=document.createElement('div');div.className='match';div.innerHTML='<b>'+g.h+' vs '+g.a+'</b><div class="odds"><div class="odd '+(selType=='HOME'?'sel':'')+'" onclick="toggleBet('+g.id+',1)">'+g.h+' '+g.ho+'</div><div class="odd '+(selType=='DRAW'?'sel':'')
