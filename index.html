<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getFirestore, doc, getDoc, setDoc } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyDSGfITcfwHx_90dM4TqjENNYbcSzo2uV0",
  authDomain: "live-dls-kenya.firebaseapp.com",
  projectId: "live-dls-kenya",
  storageBucket: "live-dls-kenya.firebasestorage.app",
  messagingSenderId: "614038679429",
  appId: "1:614038679429:web:9e6bfebfefcdd72a7b9eec"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

// WALLET FUNCTION - Shows real balance
window.loadWallet = async function(phone) {
  try {
    const walletRef = doc(db, "wallets", phone);
    const snap = await getDoc(walletRef);
    if (snap.exists()) {
      const balance = snap.data().balance || 0;
      console.log("Wallet KES", balance);
      // Find all places showing KES 0 and update
      document.body.innerHTML = document.body.innerHTML.replace(/KES 0/g, `KES ${balance}`);
      return balance;
    } else {
      // Create wallet with 0 if not exists
      await setDoc(walletRef, { balance: 0, phone: phone });
      return 0;
    }
  } catch (e) {
    console.log("Wallet error:", e);
  }
};

// Auto load if user logged in
const savedPhone = localStorage.getItem("userPhone");
if (savedPhone) {
  loadWallet(savedPhone);
}

console.log("Firebase Connected! Live DLS Kenya LIVE!");
</script>
